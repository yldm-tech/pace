      - name: Verify the BeautifulSoup fixture matches Python
        working-directory: apps/api
        run: |
          python ../api-go/tools/generate_soup_fixture.py > /tmp/soup_round_trip.json
          if ! diff -u ../api-go/internal/soup/testdata/round_trip.json /tmp/soup_round_trip.json; then
