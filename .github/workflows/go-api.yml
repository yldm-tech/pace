          python ../api-go/tools/generate_issue_filters_fixture.py > /tmp/issue_filters.tsv
          if ! diff -u ../api-go/internal/issuefilters/testdata/issue_filters.tsv /tmp/issue_filters.tsv; then
            echo "::error::apps/api-go/internal/issuefilters/testdata/issue_filters.tsv is stale."
            echo "Regenerate it from apps/api with:"
