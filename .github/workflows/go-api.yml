name: Go API

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/go-api.yml"
      - "apps/api-go/**"
      - "apps/api/plane/db/migrations/**"
      - "apps/proxy/Caddyfile.ce"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test against Django PostgreSQL schema
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15.7-alpine
        env:
          POSTGRES_USER: pace
          POSTGRES_PASSWORD: pace
          POSTGRES_DB: pace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pace -d pace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://pace:pace@localhost:5432/pace
      AUTH_TEST_DATABASE_URL: postgresql://pace:pace@localhost:5432/pace
      USER_TEST_DATABASE_URL: postgresql://pace:pace@localhost:5432/pace
      WORKSPACE_TEST_DATABASE_URL: postgresql://pace:pace@localhost:5432/pace
      PROJECT_TEST_DATABASE_URL: postgresql://pace:pace@localhost:5432/pace
      WORKER_TEST_DATABASE_URL: postgresql://pace:pace@localhost:5432/pace
      BEAT_TEST_DATABASE_URL: postgresql://pace:pace@localhost:5432/pace
      DJANGO_SETTINGS_MODULE: plane.settings.test
      SECRET_KEY: pace-ci-schema-compatibility-key
      REDIS_URL: redis://localhost:6379/0
      WEB_URL: http://localhost:8000
      APP_BASE_URL: http://localhost:3000
      SKIP_ENV_VAR: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements/base.txt

      - name: Install Django dependencies
        run: python -m pip install --disable-pip-version-check -r apps/api/requirements/base.txt

      - name: Apply authoritative Django schema
        working-directory: apps/api
        run: |
          mkdir -p plane/static-assets/collected-static
          python manage.py migrate --noinput

      - name: Verify the relation graph matches the Django models
        working-directory: apps/api
        run: |
          python ../api-go/tools/generate_relation_graph.py > /tmp/relation_graph.json
          if ! diff -u ../api-go/internal/worker/relation_graph.json /tmp/relation_graph.json; then
            echo "::error::apps/api-go/internal/worker/relation_graph.json is stale."
            echo "Regenerate it from apps/api with:"
            echo "  python ../api-go/tools/generate_relation_graph.py > ../api-go/internal/worker/relation_graph.json"
            exit 1
          fi

      - name: Verify the issue ordering fixture matches Django
        working-directory: apps/api
        run: |
          python ../api-go/tools/generate_issue_order_fixture.py > /tmp/issue_order_by.tsv
          if ! diff -u ../api-go/internal/project/testdata/issue_order_by.tsv /tmp/issue_order_by.tsv; then
            echo "::error::apps/api-go/internal/project/testdata/issue_order_by.tsv is stale."
            echo "Regenerate it from apps/api with:"
            echo "  python ../api-go/tools/generate_issue_order_fixture.py > ../api-go/internal/project/testdata/issue_order_by.tsv"
            exit 1
          fi

      - name: Verify the external work item ordering fixture matches Django
        working-directory: apps/api
        run: |
          python ../api-go/tools/generate_external_issue_order_fixture.py > /tmp/external_issue_order_by.tsv
          if ! diff -u ../api-go/internal/externalapi/testdata/issue_order_by.tsv /tmp/external_issue_order_by.tsv; then
            echo "::error::apps/api-go/internal/externalapi/testdata/issue_order_by.tsv is stale."
            echo "Regenerate it from apps/api with:"
            echo "  python ../api-go/tools/generate_external_issue_order_fixture.py > ../api-go/internal/externalapi/testdata/issue_order_by.tsv"
            exit 1
          fi

      - name: Verify the lxml fragment fixture matches lxml
        working-directory: apps/api
        run: |
          python ../api-go/tools/generate_lxml_fragment_fixture.py > /tmp/lxml_fragment.tsv
          if ! diff -u ../api-go/internal/htmlsanitizer/testdata/lxml_fragment.tsv /tmp/lxml_fragment.tsv; then
            echo "::error::apps/api-go/internal/htmlsanitizer/testdata/lxml_fragment.tsv is stale."
            echo "Regenerate it from apps/api with:"
            echo "  python ../api-go/tools/generate_lxml_fragment_fixture.py > ../api-go/internal/htmlsanitizer/testdata/lxml_fragment.tsv"
            exit 1
          fi

      - name: Verify the view query fixture matches Python
        working-directory: apps/api
        run: |
          python ../api-go/tools/generate_view_query_fixture.py > /tmp/view_query.tsv
          if ! diff -u ../api-go/internal/project/testdata/view_query.tsv /tmp/view_query.tsv; then
            echo "::error::apps/api-go/internal/project/testdata/view_query.tsv is stale."
            echo "Regenerate it from apps/api with:"
            echo "  python ../api-go/tools/generate_view_query_fixture.py > ../api-go/internal/project/testdata/view_query.tsv"
            exit 1
          fi

      - name: Verify the sort data fixture matches Python
        working-directory: apps/api
        run: |
          python ../api-go/tools/generate_sort_data_fixture.py > /tmp/sort_data.tsv
          if ! diff -u ../api-go/internal/project/testdata/sort_data.tsv /tmp/sort_data.tsv; then
            echo "::error::apps/api-go/internal/project/testdata/sort_data.tsv is stale."
            echo "Regenerate it from apps/api with:"
            echo "  python ../api-go/tools/generate_sort_data_fixture.py > ../api-go/internal/project/testdata/sort_data.tsv"
            exit 1
          fi

      - name: Verify the burndown fixture matches Python
        working-directory: apps/api
        run: |
          python ../api-go/tools/generate_burndown_fixture.py > /tmp/burndown.tsv
          if ! diff -u ../api-go/internal/project/testdata/burndown.tsv /tmp/burndown.tsv; then
            echo "::error::apps/api-go/internal/project/testdata/burndown.tsv is stale."
            echo "Regenerate it from apps/api with:"
            echo "  python ../api-go/tools/generate_burndown_fixture.py > ../api-go/internal/project/testdata/burndown.tsv"
            exit 1
          fi

      - name: Verify the cycle progress fixture matches Python
        working-directory: apps/api
        run: |
          python ../api-go/tools/generate_cycle_progress_fixture.py > /tmp/cycle_progress.tsv
          if ! diff -u ../api-go/internal/project/testdata/cycle_progress.tsv /tmp/cycle_progress.tsv; then
            echo "::error::apps/api-go/internal/project/testdata/cycle_progress.tsv is stale."
            echo "Regenerate it from apps/api with:"
            echo "  python ../api-go/tools/generate_cycle_progress_fixture.py > ../api-go/internal/project/testdata/cycle_progress.tsv"
            exit 1
          fi

      - name: Verify the DRF float fixture matches Python
        working-directory: apps/api
        run: |
          python ../api-go/tools/generate_drf_float_fixture.py > /tmp/float_rendering.tsv
          if ! diff -u ../api-go/internal/drf/testdata/float_rendering.tsv /tmp/float_rendering.tsv; then
            echo "::error::apps/api-go/internal/drf/testdata/float_rendering.tsv is stale."
            echo "Regenerate it from apps/api with:"
            echo "  python ../api-go/tools/generate_drf_float_fixture.py > ../api-go/internal/drf/testdata/float_rendering.tsv"
            exit 1
          fi

      - name: Verify the DRF datetime fixture matches Django
        working-directory: apps/api
        run: |
          python ../api-go/tools/generate_drf_time_fixture.py > /tmp/iso8601.tsv
          if ! diff -u ../api-go/internal/drf/testdata/iso8601.tsv /tmp/iso8601.tsv; then
            echo "::error::apps/api-go/internal/drf/testdata/iso8601.tsv is stale."
            echo "Regenerate it from apps/api with:"
            echo "  python ../api-go/tools/generate_drf_time_fixture.py > ../api-go/internal/drf/testdata/iso8601.tsv"
            exit 1
          fi

      - name: Verify the filename sanitizer fixture matches Django
        working-directory: apps/api
        run: |
          python ../api-go/tools/generate_sanitize_filename_fixture.py > /tmp/sanitize_filename.tsv
          if ! diff -u ../api-go/internal/uploads/testdata/sanitize_filename.tsv /tmp/sanitize_filename.tsv; then
            echo "::error::apps/api-go/internal/project/testdata/sanitize_filename.tsv is stale."
            echo "Regenerate it from apps/api with:"
            echo "  python ../api-go/tools/generate_sanitize_filename_fixture.py > ../api-go/internal/uploads/testdata/sanitize_filename.tsv"
            exit 1
          fi

      - name: Verify the issue filter fixture matches Django
        working-directory: apps/api
        run: |
          python ../api-go/tools/generate_issue_filters_fixture.py > /tmp/issue_filters.tsv
          if ! diff -u ../api-go/internal/project/testdata/issue_filters.tsv /tmp/issue_filters.tsv; then
            echo "::error::apps/api-go/internal/project/testdata/issue_filters.tsv is stale."
            echo "Regenerate it from apps/api with:"
            echo "  python ../api-go/tools/generate_issue_filters_fixture.py > ../api-go/internal/project/testdata/issue_filters.tsv"
            exit 1
          fi

      - name: Verify the grouped paginator fixture matches Django
        working-directory: apps/api
        run: |
          python ../api-go/tools/generate_grouped_paginator_fixture.py > /tmp/grouped.tsv
          if ! diff -u ../api-go/internal/pagination/testdata/grouped.tsv /tmp/grouped.tsv; then
            echo "::error::apps/api-go/internal/pagination/testdata/grouped.tsv is stale."
            echo "Regenerate it from apps/api with:"
            echo "  python ../api-go/tools/generate_grouped_paginator_fixture.py > ../api-go/internal/pagination/testdata/grouped.tsv"
            exit 1
          fi

      - name: Verify the offset paginator fixture matches Django
        working-directory: apps/api
        run: |
          python ../api-go/tools/generate_offset_paginator_fixture.py > /tmp/offset.tsv
          if ! diff -u ../api-go/internal/pagination/testdata/offset.tsv /tmp/offset.tsv; then
            echo "::error::apps/api-go/internal/pagination/testdata/offset.tsv is stale."
            echo "Regenerate it from apps/api with:"
            echo "  python ../api-go/tools/generate_offset_paginator_fixture.py > ../api-go/internal/pagination/testdata/offset.tsv"
            exit 1
          fi

      - name: Verify the sub-grouped paginator fixture matches Django
        working-directory: apps/api
        run: |
          python ../api-go/tools/generate_subgrouped_fixture.py > /tmp/subgrouped.tsv
          if ! diff -u ../api-go/internal/pagination/testdata/subgrouped.tsv /tmp/subgrouped.tsv; then
            echo "::error::apps/api-go/internal/pagination/testdata/subgrouped.tsv is stale."
            echo "Regenerate it from apps/api with:"
            echo "  python ../api-go/tools/generate_subgrouped_fixture.py > ../api-go/internal/pagination/testdata/subgrouped.tsv"
            exit 1
          fi

      - name: Verify the Django route inventory is current
        working-directory: apps/api
        run: |
          python ../api-go/tools/generate_django_routes.py > /tmp/django_routes.tsv
          if ! diff -u ../api-go/internal/server/testdata/django_routes.tsv /tmp/django_routes.tsv; then
            echo "::error::apps/api-go/internal/server/testdata/django_routes.tsv is stale."
            echo "Regenerate it from apps/api with:"
            echo "  python ../api-go/tools/generate_django_routes.py > ../api-go/internal/server/testdata/django_routes.tsv"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum

      - name: Test Go API
        working-directory: apps/api-go
        run: go test -count=1 ./...

      - name: Test Go API with race detector
        working-directory: apps/api-go
        run: go test -race -count=1 ./...

      - name: Vet Go API
        working-directory: apps/api-go
        run: go vet ./...
