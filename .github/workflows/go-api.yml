            echo "::error::apps/api-go/internal/externalapi/testdata/plain_issue_order_by.tsv is stale."
            echo "Regenerate it from apps/api with:"
            echo "  python ../api-go/tools/generate_plain_issue_order_fixture.py > ../api-go/internal/externalapi/testdata/plain_issue_order_by.tsv"
