          python ../api-go/tools/generate_view_query_fixture.py > /tmp/view_query.tsv
          if ! diff -u ../api-go/internal/project/testdata/view_query.tsv /tmp/view_query.tsv; then
            echo "::error::apps/api-go/internal/project/testdata/view_query.tsv is stale."
            echo "Regenerate it from apps/api with:"
            echo "  python ../api-go/tools/generate_view_query_fixture.py > ../api-go/internal/project/testdata/view_query.tsv"
            exit 1
          fi

      - name: Verify the notification email rendering matches Django
        working-directory: apps/api
        run: |
          for copy in ../api-go/internal/djangotemplate/testdata ../api-go/internal/worker/templates/emails/notifications; do
            target="$copy/issue-updates.html"
            if ! diff -u "$target" templates/emails/notifications/issue-updates.html; then
              echo "::error::$target is not the template apps/api ships."
              echo "Copy it across with:"
              echo "  cp templates/emails/notifications/issue-updates.html $target"
              exit 1
            fi
          done
          analytics=../api-go/internal/worker/templates/emails/exports/analytics.html
          if ! diff -u "$analytics" templates/emails/exports/analytics.html; then
            echo "::error::$analytics is not the template apps/api ships."
            echo "Copy it across with:"
            echo "  cp templates/emails/exports/analytics.html $analytics"
            exit 1
          fi
          python ../api-go/tools/generate_django_template_fixture.py > /tmp/issue_updates.txt
          if ! diff -u ../api-go/internal/djangotemplate/testdata/issue_updates.txt /tmp/issue_updates.txt; then
            echo "::error::apps/api-go/internal/djangotemplate/testdata/issue_updates.txt is stale."
            echo "Regenerate it from apps/api with:"
            echo "  python ../api-go/tools/generate_django_template_fixture.py > ../api-go/internal/djangotemplate/testdata/issue_updates.txt"
            exit 1
          fi

      - name: Verify the work item activity fixture matches Python
        working-directory: apps/api
        run: |
          python ../api-go/tools/generate_issue_activity_fixture.py > /tmp/issue_activity.tsv
          if ! diff -u ../api-go/internal/worker/testdata/issue_activity.tsv /tmp/issue_activity.tsv; then
            echo "::error::apps/api-go/internal/worker/testdata/issue_activity.tsv is stale."
            echo "Regenerate it from apps/api with:"
            echo "  python ../api-go/tools/generate_issue_activity_fixture.py > ../api-go/internal/worker/testdata/issue_activity.tsv"
            exit 1
          fi

      - name: Verify the timezone list matches Django
        working-directory: apps/api
        run: |
          python ../api-go/tools/generate_timezone_list.py > /tmp/timezones.tsv
          if ! diff -u ../api-go/internal/project/timezones.tsv /tmp/timezones.tsv; then
            echo "::error::apps/api-go/internal/project/timezones.tsv is stale, so the picker would offer a different list."
            echo "Regenerate it from apps/api with:"
            echo "  python ../api-go/tools/generate_timezone_list.py > ../api-go/internal/project/timezones.tsv"
            exit 1
          fi

      - name: Verify the instance configuration list matches Django
        working-directory: apps/api
        run: |
          python ../api-go/tools/generate_instance_config_variables.py > /tmp/instance_config.tsv
          if ! diff -u ../api-go/internal/manage/instance_config.tsv /tmp/instance_config.tsv; then
            echo "::error::apps/api-go/internal/manage/instance_config.tsv is stale, so configure_instance would miss a variable."
            echo "Regenerate it from apps/api with:"
            echo "  python ../api-go/tools/generate_instance_config_variables.py > ../api-go/internal/manage/instance_config.tsv"
            exit 1
          fi

      - name: Verify the seed data matches the one apps/api ships
        working-directory: apps/api
        run: |
          for seed in cycles issues labels modules pages projects states views; do
            target=../api-go/internal/worker/seeds/$seed.json
            if ! diff -u "$target" plane/seeds/data/$seed.json; then
              echo "::error::$target is not the seed apps/api ships, so a new workspace would be seeded differently."
              echo "Copy it across with:"
              echo "  cp plane/seeds/data/$seed.json $target"
              exit 1
            fi
          done

      - name: Verify the project invitation template matches the one apps/api ships
        working-directory: apps/api
        run: |
          target=../api-go/internal/worker/templates/emails/invitations/project_invitation.html
          if ! diff -u "$target" templates/emails/invitations/project_invitation.html; then
            echo "::error::$target is not the template apps/api ships."
            echo "Copy it across with:"
            echo "  cp templates/emails/invitations/project_invitation.html $target"
            exit 1
          fi

      - name: Verify the migration list matches Django
        working-directory: apps/api
        run: |
          python ../api-go/tools/generate_migration_list.py > /tmp/migrations.tsv
          if ! diff -u ../api-go/internal/manage/migrations.tsv /tmp/migrations.tsv; then
            echo "::error::apps/api-go/internal/manage/migrations.tsv is stale, so wait_for_migrations would let a deploy through early."
            echo "Regenerate it from apps/api with:"
            echo "  python ../api-go/tools/generate_migration_list.py > ../api-go/internal/manage/migrations.tsv"
            exit 1
