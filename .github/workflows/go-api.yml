name: Go API

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/go-api.yml"
      - "apps/api/**"
      - "packages/editor/**"
      - "apps/proxy/Caddyfile.ce"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test against the PostgreSQL schema the migrator builds
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15.7-alpine
        env:
          POSTGRES_USER: pace
          POSTGRES_PASSWORD: pace
          POSTGRES_DB: pace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pace -d pace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://pace:pace@localhost:5432/pace
      AUTH_TEST_DATABASE_URL: postgresql://pace:pace@localhost:5432/pace
      USER_TEST_DATABASE_URL: postgresql://pace:pace@localhost:5432/pace
      WORKSPACE_TEST_DATABASE_URL: postgresql://pace:pace@localhost:5432/pace
      PROJECT_TEST_DATABASE_URL: postgresql://pace:pace@localhost:5432/pace
      WORKER_TEST_DATABASE_URL: postgresql://pace:pace@localhost:5432/pace
      BEAT_TEST_DATABASE_URL: postgresql://pace:pace@localhost:5432/pace
      MIGRATE_TEST_DATABASE_URL: postgresql://pace:pace@localhost:5432/pace_migration_replay?sslmode=disable
      SECRET_KEY: pace-ci-schema-compatibility-key
      REDIS_URL: redis://localhost:6379/0
      WEB_URL: http://localhost:8000
      APP_BASE_URL: http://localhost:3000
      SKIP_ENV_VAR: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      # The schema every other step runs against, built the way production builds it. It used to be laid down by manage.py migrate; the recorded statements the Go engine replays were taken from that, and testdata/schema.tsv is what they have to produce.
      - name: Apply the schema
        working-directory: apps/api
        run: go run ./cmd/manage migrate

      # The database the replay test builds into. It empties it before it starts, so the suite running more than once — plainly and again under the race detector — is fine.
      - name: Make the replay database
        run: psql "postgresql://pace:pace@localhost:5432/postgres" -c 'CREATE DATABASE pace_migration_replay OWNER pace'

      - name: Test Go API
        working-directory: apps/api
        run: go test -count=1 ./...

      - name: Test Go API with race detector
        working-directory: apps/api
        run: go test -race -count=1 ./...

      - name: Vet Go API
        working-directory: apps/api
        run: go vet ./...

  editor-fixtures:
    name: Verify the generated files match the packages they come from
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Enable Corepack and pnpm
        run: corepack enable pnpm

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install editor dependencies
        run: pnpm install --frozen-lockfile --filter @pace/editor...

      # Installing is not enough. The generators bundle @pace/editor's source, which imports @pace/utils and its siblings by name, and those resolve through a dist that nothing builds on install — none of them has a prepare script. Without this every generator fails with "Could not resolve @pace/utils".
      #
      # propel is excluded because it does not build: emoji-picker.tsx imports ./icon/icon-root and that file is in no commit on any branch, which breaks apps/web and apps/space too. None of the entry points these generators bundle reaches propel, so leaving it out costs nothing here and keeps a frontend problem from holding this workflow red.
      - name: Build the packages the editor imports
        run: pnpm --filter "@pace/editor^..." --filter "!@pace/propel" build

      - name: Verify the document editor schema matches the editor
        run: |
          node apps/api/tools/generate_ydoc_schema.mjs > /tmp/schema.json
          if ! diff -u apps/api/internal/ydoc/schema.json /tmp/schema.json; then
            echo "::error::apps/api/internal/ydoc/schema.json is stale."
            echo "Regenerate it from the repository root with:"
            echo "  node apps/api/tools/generate_ydoc_schema.mjs > apps/api/internal/ydoc/schema.json"
            exit 1
          fi

      - name: Verify the content expressions match ProseMirror
        run: |
          node apps/api/tools/generate_content_match_fixture.mjs > /tmp/content_match.json
          if ! diff -u apps/api/internal/ydoc/testdata/content_match.json /tmp/content_match.json; then
            echo "::error::apps/api/internal/ydoc/testdata/content_match.json is stale."
            echo "Regenerate it from the repository root with:"
            echo "  node apps/api/tools/generate_content_match_fixture.mjs > apps/api/internal/ydoc/testdata/content_match.json"
            exit 1
          fi

      - name: Verify the emoji table matches the editor
        run: |
          node apps/api/tools/generate_ydoc_emoji.mjs > /tmp/emoji.tsv
          if ! diff -u apps/api/internal/ydoc/emoji.tsv /tmp/emoji.tsv; then
            echo "::error::apps/api/internal/ydoc/emoji.tsv is stale."
            echo "Regenerate it from the repository root with:"
            echo "  node apps/api/tools/generate_ydoc_emoji.mjs > apps/api/internal/ydoc/emoji.tsv"
            exit 1
          fi

      - name: Verify the rich text schema matches the editor
        run: |
          node apps/api/tools/generate_ydoc_schema.mjs --variant=rich > /tmp/schema_rich.json
          if ! diff -u apps/api/internal/ydoc/schema_rich.json /tmp/schema_rich.json; then
            echo "::error::apps/api/internal/ydoc/schema_rich.json is stale."
            echo "Regenerate it from the repository root with:"
            echo "  node apps/api/tools/generate_ydoc_schema.mjs --variant=rich > apps/api/internal/ydoc/schema_rich.json"
            exit 1
          fi

      - name: Verify the rich text parse rules match the schema
        run: |
          node apps/api/tools/generate_parse_rules.mjs --variant=rich > /tmp/parse_rules_rich.json
          if ! diff -u apps/api/internal/ydoc/parse_rules_rich.json /tmp/parse_rules_rich.json; then
            echo "::error::apps/api/internal/ydoc/parse_rules_rich.json is stale."
            echo "Regenerate it from the repository root with:"
            echo "  node apps/api/tools/generate_parse_rules.mjs --variant=rich > apps/api/internal/ydoc/parse_rules_rich.json"
            exit 1
          fi

      - name: Verify the converted documents match the editor
        run: |
          node apps/api/tools/generate_convert_fixture.mjs > /tmp/converted.json
          if ! diff -u apps/api/internal/live/testdata/converted.json /tmp/converted.json; then
            echo "::error::apps/api/internal/live/testdata/converted.json is stale."
            echo "Regenerate it from the repository root with:"
            echo "  node apps/api/tools/generate_convert_fixture.mjs > apps/api/internal/live/testdata/converted.json"
            exit 1
          fi

      - name: Verify the parse rules match the schema
        run: |
          node apps/api/tools/generate_parse_rules.mjs > /tmp/parse_rules.json
          if ! diff -u apps/api/internal/ydoc/parse_rules.json /tmp/parse_rules.json; then
            echo "::error::apps/api/internal/ydoc/parse_rules.json is stale."
            echo "Regenerate it from the repository root with:"
            echo "  node apps/api/tools/generate_parse_rules.mjs > apps/api/internal/ydoc/parse_rules.json"
            exit 1
          fi

      - name: Verify the parsed documents match the editor
        run: |
          node apps/api/tools/generate_parse_fixture.mjs > /tmp/parsed.json
          if ! diff -u apps/api/internal/ydoc/testdata/parsed.json /tmp/parsed.json; then
            echo "::error::apps/api/internal/ydoc/testdata/parsed.json is stale."
            echo "Regenerate it from the repository root with:"
            echo "  node apps/api/tools/generate_parse_fixture.mjs > apps/api/internal/ydoc/testdata/parsed.json"
            exit 1
          fi

      - name: Verify the written updates match the editor
        run: |
          node apps/api/tools/generate_tobinary_fixture.mjs > /tmp/updates.json
          if ! diff -u apps/api/internal/ydoc/testdata/updates.json /tmp/updates.json; then
            echo "::error::apps/api/internal/ydoc/testdata/updates.json is stale."
            echo "Regenerate it from the repository root with:"
            echo "  node apps/api/tools/generate_tobinary_fixture.mjs > apps/api/internal/ydoc/testdata/updates.json"
            exit 1
          fi

      - name: Verify the parsed trees match zeed-dom
        run: |
          node apps/api/tools/generate_vdom_fixture.mjs > /tmp/trees.json
          if ! diff -u apps/api/internal/vdom/testdata/trees.json /tmp/trees.json; then
            echo "::error::apps/api/internal/vdom/testdata/trees.json is stale."
            echo "Regenerate it from the repository root with:"
            echo "  node apps/api/tools/generate_vdom_fixture.mjs > apps/api/internal/vdom/testdata/trees.json"
            exit 1
          fi

      - name: Verify the document corpus matches the editor
        run: |
          node apps/api/tools/generate_ydoc_fixture.mjs > /tmp/documents.json
          if ! diff -u apps/api/internal/ydoc/testdata/documents.json /tmp/documents.json; then
            echo "::error::apps/api/internal/ydoc/testdata/documents.json is stale."
            echo "Regenerate it from the repository root with:"
            echo "  node apps/api/tools/generate_ydoc_fixture.mjs > apps/api/internal/ydoc/testdata/documents.json"
            exit 1
          fi

