      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum

      - name: Test Go API
        working-directory: apps/api-go
        run: go test -count=1 ./...

      - name: Test Go API with race detector
        working-directory: apps/api-go
        run: go test -race -count=1 ./...

      - name: Vet Go API
        working-directory: apps/api-go
        run: go vet ./...

  editor-fixtures:
    name: Verify the generated files match the packages they come from
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Enable Corepack and pnpm
        run: corepack enable pnpm

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install editor and live dependencies
        run: pnpm install --frozen-lockfile --filter @plane/editor... --filter live...

      - name: Verify the document editor schema matches the editor
        run: |
          node apps/api-go/tools/generate_ydoc_schema.mjs > /tmp/schema.json
          if ! diff -u apps/api-go/internal/ydoc/schema.json /tmp/schema.json; then
            echo "::error::apps/api-go/internal/ydoc/schema.json is stale."
            echo "Regenerate it from the repository root with:"
            echo "  node apps/api-go/tools/generate_ydoc_schema.mjs > apps/api-go/internal/ydoc/schema.json"
            exit 1
          fi

      - name: Verify the content expressions match ProseMirror
        run: |
          node apps/api-go/tools/generate_content_match_fixture.mjs > /tmp/content_match.json
          if ! diff -u apps/api-go/internal/ydoc/testdata/content_match.json /tmp/content_match.json; then
            echo "::error::apps/api-go/internal/ydoc/testdata/content_match.json is stale."
            echo "Regenerate it from the repository root with:"
            echo "  node apps/api-go/tools/generate_content_match_fixture.mjs > apps/api-go/internal/ydoc/testdata/content_match.json"
            exit 1
          fi

      - name: Verify the emoji table matches the editor
        run: |
          node apps/api-go/tools/generate_ydoc_emoji.mjs > /tmp/emoji.tsv
          if ! diff -u apps/api-go/internal/ydoc/emoji.tsv /tmp/emoji.tsv; then
            echo "::error::apps/api-go/internal/ydoc/emoji.tsv is stale."
            echo "Regenerate it from the repository root with:"
            echo "  node apps/api-go/tools/generate_ydoc_emoji.mjs > apps/api-go/internal/ydoc/emoji.tsv"
            exit 1
          fi

      - name: Verify the parse rules match the schema
        run: |
          node apps/api-go/tools/generate_parse_rules.mjs > /tmp/parse_rules.json
          if ! diff -u apps/api-go/internal/ydoc/parse_rules.json /tmp/parse_rules.json; then
            echo "::error::apps/api-go/internal/ydoc/parse_rules.json is stale."
            echo "Regenerate it from the repository root with:"
            echo "  node apps/api-go/tools/generate_parse_rules.mjs > apps/api-go/internal/ydoc/parse_rules.json"
            exit 1
          fi

      - name: Verify the parsed documents match the editor
        run: |
          node apps/api-go/tools/generate_parse_fixture.mjs > /tmp/parsed.json
          if ! diff -u apps/api-go/internal/ydoc/testdata/parsed.json /tmp/parsed.json; then
            echo "::error::apps/api-go/internal/ydoc/testdata/parsed.json is stale."
            echo "Regenerate it from the repository root with:"
            echo "  node apps/api-go/tools/generate_parse_fixture.mjs > apps/api-go/internal/ydoc/testdata/parsed.json"
            exit 1
          fi

      - name: Verify the written updates match the editor
        run: |
          node apps/api-go/tools/generate_tobinary_fixture.mjs > /tmp/updates.json
