name: Copy Right Check

on:
    workflow_dispatch:
    pull_request:
        branches:
            - "main"
        types:
            - "opened"
            - "synchronize"
            - "ready_for_review"
            - "review_requested"
            - "reopened"

jobs:
    license-check:
        name: Copy Right Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version: "1.22"

            - name: Install addlicense
              run: |
                  go install github.com/google/addlicense@latest
                  echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

            # There was a Python step here. No .py file is tracked any more, so `$(git ls-files '*.py')` expanded to nothing, addlicense fell back to printing its usage and exiting 1, and this job could only have gone red the moment it started running. Go files are deliberately not checked: they carry no header today and adding one is a separate decision.
            - name: Check Copyright For TypeScript Files
              run: |
                  set -e
                  echo "Running copyright check..."
                  addlicense -check -f COPYRIGHT.txt -ignore "**/*.config.ts" -ignore "**/*.d.ts" $(git ls-files '*.ts' '*.tsx')
                  echo "Copyright check passed."
