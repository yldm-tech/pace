name: i18n sync check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
    types:
      - "opened"
      - "synchronize"
      - "reopened"
      - "ready_for_review"
    paths:
      - "packages/i18n/**"
      # The eager-namespace check reads the admin console's sources, so a key added there has to be able to fail this workflow.
      - "apps/admin/**"
      - ".github/workflows/i18n-sync-check.yml"
  push:
    branches:
      - "main"
    paths:
      - "packages/i18n/**"
      - "apps/admin/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-check:
    name: check:sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"

      - name: Enable Corepack and pnpm
        run: corepack enable pnpm

      - name: Run sync check
        run: pnpm dlx tsx packages/i18n/scripts/sync-check.ts --ci

      # Report only, and deliberately not a gate: it infers whether a key is used from the string literals in apps/ and packages/, which is a heuristic that goes wrong the moment a key is assembled somewhere the template-prefix scan does not model. Gating on it would fail an unrelated PR for a key it never touched. `--summary` keeps it to counts and per-namespace totals; run `pnpm --filter @pace/i18n unused:check` locally for the full key list, and `--max=<n>` if this is ever ratcheted.
      #
      # The job's path filters are not widened for this step even though it reads every app: the number only needs to be visible when someone is already working on the catalogue, and triggering this workflow on all of apps/ would run it on nearly every PR to print a figure nothing gates on.
      - name: Report unused keys
        continue-on-error: true
        run: pnpm dlx tsx packages/i18n/scripts/unused-check.ts --summary
