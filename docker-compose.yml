services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api-go

  admin:
    container_name: admin
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api-go
      - web

  space:
    container_name: space
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api-go
      - web

  api-go:
    container_name: pace-api-go
    build:
      context: ./apps/api-go
      dockerfile: Dockerfile
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq

  worker-go:
    container_name: pace-worker-go
    build:
      context: ./apps/api-go
      dockerfile: Dockerfile
    entrypoint: ["pace-entrypoint-worker"]
    restart: always
    env_file:
      - ./apps/api/.env
    environment:
      # The only consumer left. Every one of the forty-six tasks is registered here, and the API and the beat route all forty-six to this queue, so nothing is published to the queue Celery would have used.
      PACE_WORKER_QUEUE: ${PACE_WORKER_QUEUE:-pace-go}
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq

  # The Go beat, replacing beat-worker rather than running beside it: both read the same django_celery_beat tables, so running both would queue every periodic task twice. beat-worker is removed in the same change for that reason.
  #
  # It keeps its own container name rather than taking over beatworker, because nothing addresses the scheduler by name: it talks to Postgres and RabbitMQ and nothing talks to it.
  beat-go:
    container_name: pace-beat-go
    build:
      context: ./apps/api-go
      dockerfile: Dockerfile
    entrypoint: ["pace-entrypoint-beat"]
    restart: always
    env_file:
      - ./apps/api/.env
    environment:
      # The queue it routes the twelve periodic tasks to, which is the one worker-go consumes.
      PACE_WORKER_QUEUE: ${PACE_WORKER_QUEUE:-pace-go}
    depends_on:
      - plane-db
      - plane-mq

  # The schema, now applied by Go. It runs the same 164 migrations in the same order and writes the same django_migrations rows, because the statements it runs were recorded from Django doing it.
  #
  # The entrypoint is the Go counterpart of ./bin/docker-entrypoint-migrator.sh, step for step. Reverting is putting ./apps/api back with command: ./bin/docker-entrypoint-migrator.sh.
  migrator:
    container_name: plane-migrator
    build:
      context: ./apps/api-go
      dockerfile: Dockerfile
      args:
        DOCKER_BUILDKIT: 1
    restart: no
    entrypoint: ["pace-entrypoint-migrator"]
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis

  # The collaborative editor, now the Go one. It replaces the Node service rather than running beside it: the proxy sends /live/* to one host, and two servers holding the same page without a relay between them would not converge.
  #
  # The service keeps the name live so that the proxy and LIVE_URL are unchanged. Reverting is switching the build back to ./apps/live/Dockerfile.live, which is still in the tree.
  live:
    container_name: plane-live
    build:
      context: ./apps/api-go
      dockerfile: Dockerfile
      args:
        DOCKER_BUILDKIT: 1
    entrypoint: ["pace-entrypoint-live"]
    restart: always
    env_file:
      - ./apps/api/.env
    environment:
      # The API it reads and writes pages through, as the editing user.
      API_BASE_URL: ${API_BASE_URL:-http://api-go:8000}
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # With no Redis it runs as a single node, and two people on one page have to reach the same server for it to converge.
      REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
    depends_on:
      - api-go
      - plane-redis

  plane-db:
    container_name: plane-db
    image: postgres:15.7-alpine
    restart: always
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data

  plane-redis:
    container_name: plane-redis
    image: valkey/valkey:7.2.11-alpine
    restart: always
    volumes:
      - redisdata:/data

  plane-mq:
    container_name: plane-mq
    image: rabbitmq:3.13.6-management-alpine
    restart: always
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  plane-minio:
    container_name: plane-minio
    image: minio/minio
    restart: always
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}

  # Comment this if you already have a reverse proxy running
  proxy:
    container_name: proxy
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.ce
    restart: always
    ports:
      - ${LISTEN_HTTP_PORT}:80
      - ${LISTEN_HTTPS_PORT}:443
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
    depends_on:
      - web
      - api-go
      - space
      - admin

volumes:
  pgdata:
  redisdata:
  uploads:
  rabbitmq_data:
