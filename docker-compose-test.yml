# Docker Compose for running the Go test suite against real services.
#
# Usage:
#   # Run everything:
#   docker compose -f docker-compose-test.yml up --build --abort-on-container-exit --exit-code-from api-tests
#
#   # Run a subset by overriding the command:
#   docker compose -f docker-compose-test.yml run --rm --build api-tests go test ./internal/beat/ -run Schema
#
#   # Tear down (removes ephemeral volumes and the test network):
#   docker compose -f docker-compose-test.yml down -v
#
# Notes:
# - Postgres / Valkey / RabbitMQ / MinIO start with health checks; the test runner only starts once each dependency is healthy.
# - Data dirs are tmpfs so every run begins from a clean state.
# - The schema is built by the Go migrator before the tests run, which is also the first thing every run checks: if the recorded migrations no longer apply, nothing else gets to fail first.
# - Most of the suite runs without a database. The parts that do not are opt-in on one environment variable each, and the entrypoint below sets all of them at the same database.

services:
  test-db:
    image: postgres:15.7-alpine
    networks:
      - test_env
    env_file:
      - ./apps/api-go/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plane}
      POSTGRES_DB: ${POSTGRES_DB:-plane}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plane} -d ${POSTGRES_DB:-plane}"]
      interval: 5s
      timeout: 5s
      retries: 10

  test-redis:
    image: valkey/valkey:7.2.11-alpine
    networks:
      - test_env
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-mq:
    image: rabbitmq:3.13.6-management-alpine
    networks:
      - test_env
    env_file:
      - ./apps/api-go/.env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plane}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  test-minio:
    # quay.io rather than Docker Hub: minio/minio was withdrawn from Docker Hub and now 404s there, while the rest of the minio namespace stayed. quay.io is MinIO's own other registry and still carries it.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    networks:
      - test_env
    env_file:
      - ./apps/api-go/.env
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-access-key}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-secret-key}
    entrypoint: >
      /bin/sh -c "
      mkdir -p /export/${AWS_S3_BUCKET_NAME:-uploads} &&
      minio server /export --console-address ':9090' &
      sleep 3 &&
      mc alias set local http://localhost:9000 ${AWS_ACCESS_KEY_ID:-access-key} ${AWS_SECRET_ACCESS_KEY:-secret-key} &&
      mc mb local/${AWS_S3_BUCKET_NAME:-uploads} -p || true &&
      tail -f /dev/null
      "
    tmpfs:
      - /export
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-tests:
    build:
      context: ./apps/api-go
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    networks:
      - test_env
    env_file:
      - ./apps/api-go/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@test-db:5432/${POSTGRES_DB:-plane}
      REDIS_URL: redis://test-redis:6379/
      AMQP_URL: amqp://${RABBITMQ_USER:-plane}:${RABBITMQ_PASSWORD:-plane}@test-mq:5672/${RABBITMQ_VHOST:-plane}
      AWS_S3_ENDPOINT_URL: http://test-minio:9000
      SECRET_KEY: test-secret-key
      # One database, named once per suite that asks for one. A test that is not given its variable skips rather than failing, so leaving one out here quietly shrinks the run.
      AUTH_TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@test-db:5432/${POSTGRES_DB:-plane}?sslmode=disable
      USER_TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@test-db:5432/${POSTGRES_DB:-plane}?sslmode=disable
      WORKSPACE_TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@test-db:5432/${POSTGRES_DB:-plane}?sslmode=disable
      PROJECT_TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@test-db:5432/${POSTGRES_DB:-plane}?sslmode=disable
      WORKER_TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@test-db:5432/${POSTGRES_DB:-plane}?sslmode=disable
      BEAT_TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@test-db:5432/${POSTGRES_DB:-plane}?sslmode=disable
    volumes:
      - ./apps/api-go:/src
    working_dir: /src
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
      test-mq:
        condition: service_healthy
      test-minio:
        condition: service_healthy
    # The schema first, then whatever was asked for. Any args passed via `docker compose run api-tests <args>` replace the default command.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        go run ./cmd/manage migrate
        exec "$@"
      - --
    command: ["go", "test", "./..."]

networks:
  test_env:
    driver: bridge
