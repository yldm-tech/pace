# Image overrides for upstream's plane-ce Helm chart, so it deploys what this repository builds.
#
# The chart is fine as it stands -- workloads, services, ingress, dependencies are all reusable. Only the images differ. Each key below is the value the corresponding workload template reads, verified against plane-ce 1.8.1.
#
#   helm repo add plane-ce https://helm.plane.so/
#   helm install plane plane-ce/plane-ce -f values.yaml
#
# planeVersion is the tag applied to every image above, so it has to name a release this repository has actually published. Check https://github.com/yldm-tech/pace/releases, or the package listing on ghcr, before installing.
#
# There is no proxy entry: the chart routes through an ingress instead, so pace-proxy has no counterpart here.

planeVersion: stable

web:
  image: ghcr.io/yldm-tech/pace-frontend

space:
  image: ghcr.io/yldm-tech/pace-space

admin:
  image: ghcr.io/yldm-tech/pace-admin

live:
  image: ghcr.io/yldm-tech/pace-live

api:
  image: ghcr.io/yldm-tech/pace-backend

worker:
  image: ghcr.io/yldm-tech/pace-backend

beatworker:
  image: ghcr.io/yldm-tech/pace-backend
